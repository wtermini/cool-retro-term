name: macOS native app

on:
  workflow_dispatch:
  push:
    paths:
      - 'macos/**'
      - 'app/qml/fonts/**'
      - 'app/qml/ApplicationSettings.qml'
      - 'app/fontmanager.cpp'
      - '.github/workflows/macos-native.yml'
  pull_request:
    paths:
      - 'macos/**'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check the Metal shaders compile
        # The app compiles the shaders at launch, so this is an early check
        # only; it is skipped if this Xcode lacks the Metal toolchain.
        continue-on-error: true
        run: xcrun -sdk macosx metal -c macos/Shaders/CRT.metal -o "$RUNNER_TEMP/CRT.air"

      - name: Build the app
        run: macos/build-app.sh

      - name: Launch and take screenshots
        # Each launch runs under lldb, so a crash prints a backtrace.
        run: |
          APP_BIN="macos/build/Cool Retro Term.app/Contents/MacOS/CoolRetroTerm"
          mkdir -p screenshots
          status=0
          for profile in "Monochrome Green" "Default Amber" "IBM VGA 8x16"; do
            name=$(echo "$profile" | tr ' ' '-')
            out="$PWD/screenshots/$name.png"
            export CRT_PROFILE="$profile" CRT_SNAPSHOT_PATH="$out" CRT_SNAPSHOT_QUIT=1 \
              CRT_SNAPSHOT_COMMAND="sh $PWD/macos/scripts/demo.sh"
            lldb --batch -o run -k "thread backtrace all" -k "quit 1" -- "$APP_BIN" \
              > "screenshots/$name.log" 2>&1 &
            pid=$!
            for _ in $(seq 1 60); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "::group::$profile log"
            grep -v "^\s*$" "screenshots/$name.log" | head -150
            echo "::endgroup::"
            if [ -f "$out" ]; then echo "screenshot: $out"; else echo "::error::no screenshot for $profile"; status=1; fi
          done
          exit $status

      - name: Settings window screenshots
        if: always()
        run: |
          APP_BIN="macos/build/Cool Retro Term.app/Contents/MacOS/CoolRetroTerm"
          [ -x "$APP_BIN" ] || exit 0
          CRT_SETTINGS_SNAPSHOT_DIR="$PWD/screenshots" "$APP_BIN" > screenshots/settings.log 2>&1 &
          pid=$!
          for _ in $(seq 1 40); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat screenshots/settings.log
          ls screenshots

      - name: Print screenshot previews
        # Small JPEGs as base64 in the log, for reviewing the rendering
        # without downloading the artifact.
        if: always()
        run: |
          for png in screenshots/*.png; do
            [ -f "$png" ] || continue
            sips -Z 720 -s format jpeg -s formatOptions 60 "$png" --out "$RUNNER_TEMP/preview.jpg" > /dev/null
            echo "PREVIEW-BEGIN $(basename "$png" .png)"
            base64 -i "$RUNNER_TEMP/preview.jpg" | fold -w 4000
            echo "PREVIEW-END"
          done

      - name: Package
        if: always()
        run: |
          if [ -d "macos/build/Cool Retro Term.app" ]; then
            ditto -c -k --keepParent "macos/build/Cool Retro Term.app" Cool-Retro-Term-macOS.zip
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: Cool-Retro-Term-macOS
          path: Cool-Retro-Term-macOS.zip
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
