name: macOS native app

on:
  workflow_dispatch:
  push:
    paths:
      - 'macos/**'
      - 'app/qml/fonts/**'
      - 'app/qml/ApplicationSettings.qml'
      - 'app/qml/office/**'
      - 'app/fontmanager.cpp'
      - '.github/workflows/macos-native.yml'
  pull_request:
    paths:
      - 'macos/**'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check the Metal shaders compile
        # The app compiles the shaders at launch, so this is an early check
        # only; it is skipped if this Xcode lacks the Metal toolchain.
        continue-on-error: true
        run: xcrun -sdk macosx metal -c macos/Shaders/CRT.metal -o "$RUNNER_TEMP/CRT.air"

      - name: Build the app
        run: macos/build-app.sh --ci-hooks

      - name: Check the office desk MCP server
        run: |
          APP_BIN="macos/build/Cool Retro Term SE.app/Contents/MacOS/CoolRetroTerm"
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"set_sticky_note","arguments":{"note":"monitor","text":"Hello from CI"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"add_calendar_event","arguments":{"date":"2030-01-02","title":"CI check"}}}' \
            '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"add_calendar_event","arguments":{"date":"2030-02-30","title":"invalid"}}}' \
            | "$APP_BIN" --mcp)
          echo "$out"
          echo "$out" | grep -q '"Note updated."'
          echo "$out" | grep -q 'CI check'
          echo "$out" | grep -q '"isError":true'
          grep -q "Hello from CI" "$HOME/Library/Application Support/cool-retro-term/cool-retro-term/office-desk.json"

      - name: Launch and take screenshots
        # Each launch runs under lldb, so a crash prints a backtrace.
        run: |
          APP_BIN="macos/build/Cool Retro Term SE.app/Contents/MacOS/CoolRetroTerm"
          mkdir -p screenshots
          status=0
          # "profile|office scene|monitor|3D (1) or picture (0)".
          for entry in "Monochrome Green|||1" "Default Amber|||1" "IBM VGA 8x16|||1" \
                       "Default Amber|80s|wide|1" "Monochrome Green|90s|standard|1" "Default Amber|90s|wide|0"; do
            IFS='|' read -r profile scene monitor office3d <<< "$entry"
            name=$(echo "$profile" | tr ' ' '-')${scene:+-office-$scene-$monitor}
            [ "$office3d" = 0 ] && name="$name-2d"
            out="$PWD/screenshots/$name.png"
            export CRT_PROFILE="$profile" CRT_OFFICE_SCENE="$scene" CRT_OFFICE_3D="$office3d" CRT_OFFICE_MONITOR="$monitor" \
              CRT_SNAPSHOT_PATH="$out" CRT_SNAPSHOT_QUIT=1 \
              CRT_SNAPSHOT_COMMAND="sh $PWD/macos/scripts/demo.sh"
            lldb --batch -o run -k "thread backtrace all" -k "quit 1" -- "$APP_BIN" \
              > "screenshots/$name.log" 2>&1 &
            pid=$!
            for _ in $(seq 1 60); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "::group::$name log"
            grep -v "^\s*$" "screenshots/$name.log" | head -150
            echo "::endgroup::"
            if [ -f "$out" ]; then echo "screenshot: $out"; else echo "::error::no screenshot for $name"; status=1; fi
          done
          exit $status

      - name: Settings window screenshots
        if: always()
        run: |
          APP_BIN="macos/build/Cool Retro Term SE.app/Contents/MacOS/CoolRetroTerm"
          [ -x "$APP_BIN" ] || exit 0
          CRT_SETTINGS_SNAPSHOT_DIR="$PWD/screenshots" "$APP_BIN" > screenshots/settings.log 2>&1 &
          pid=$!
          for _ in $(seq 1 40); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat screenshots/settings.log
          ls screenshots

      - name: Print screenshot previews
        # Small JPEGs as base64 in the log, for reviewing the rendering
        # without downloading the artifact.
        if: always()
        run: |
          for png in screenshots/*.png; do
            [ -f "$png" ] || continue
            sips -Z 720 -s format jpeg -s formatOptions 60 "$png" --out "$RUNNER_TEMP/preview.jpg" > /dev/null
            echo "PREVIEW-BEGIN $(basename "$png" .png)"
            base64 -i "$RUNNER_TEMP/preview.jpg" | fold -w 4000
            echo "PREVIEW-END"
          done

      - name: Rebuild without the CI hooks for download
        # The screenshots need the CRT_* settings (build-app.sh --ci-hooks);
        # the app people download must not have them.
        id: rebuild
        if: always()
        run: macos/build-app.sh

      - name: Package
        if: always() && steps.rebuild.outcome == 'success'
        run: |
          if [ -d "macos/build/Cool Retro Term SE.app" ]; then
            ditto -c -k --keepParent "macos/build/Cool Retro Term SE.app" Cool-Retro-Term-SE-macOS.zip
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: Cool-Retro-Term-SE-macOS
          path: Cool-Retro-Term-SE-macOS.zip
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
