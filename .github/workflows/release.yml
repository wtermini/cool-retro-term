name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - '*'

# Read-only by default; only the job that publishes the release can write.
permissions:
  contents: read

jobs:
  build-appimage:
    name: Build (Linux, AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y build-essential rsync wget

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
        with:
          version: 6.10.0
          dir: ..
          modules: qt5compat qtshadertools qtquick3d
          setup-python: false
          cache: true

      - name: Build AppImage
        run: |
          ./scripts/build-appimage.sh

      - name: Collect artifact
        run: |
          mkdir -p release
          mv ./*.AppImage release/

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cool-retro-term-appimage
          path: ./release/*

  build-dmg:
    name: Build (macOS, DMG)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
        with:
          version: 6.10.*
          modules: qt5compat qtshadertools qtquick3d
          setup-python: true
          python-version: '3.11'
          cache: true

      - name: Build DMG
        run: |
          JOBS="$(sysctl -n hw.ncpu)"
          ./scripts/build-dmg.sh

      - name: Collect artifact
        run: |
          mkdir -p release
          mv ./*.dmg release/

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cool-retro-term-dmg
          path: ./release/*

  release:
    name: Create Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    needs:
      - build-appimage
      - build-dmg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download AppImage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: cool-retro-term-appimage
          path: ./release

      - name: Download DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: cool-retro-term-dmg
          path: ./release

      - name: Update rolling tag
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git tag -f rolling
          git push -f origin rolling

      - name: Publish rolling release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: rolling
          name: Rolling Release
          prerelease: true
          files: ./release/*

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./release/*
