name: Qt app

# Builds the Qt app for Linux and macOS on every change to it, without
# publishing anything (releases are made by release.yml on master and tags).

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'patches/**'
      - 'qmltermwidget'
      - 'cool-retro-term.pro'
      - 'scripts/**'
      - '.github/workflows/qt-app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'patches/**'

permissions:
  contents: read

jobs:
  linux:
    name: Build (Linux, AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y build-essential rsync wget

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
        with:
          version: 6.10.0
          dir: ..
          modules: qt5compat qtshadertools qtquick3d
          setup-python: false
          cache: true

      - name: Build
        run: ./scripts/build-appimage.sh

      - name: Check the qmltermwidget patches were applied
        run: |
          grep -q "drawBlockChar" qmltermwidget/lib/TerminalDisplay.cpp
          grep -q "tabColorRequested" qmltermwidget/lib/ksession.h

      - name: Check the office desk MCP server
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/desk"
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"set_sticky_note","arguments":{"note":"monitor","text":"Hello from CI"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"add_calendar_event","arguments":{"date":"2030-01-02","title":"CI check"}}}' \
            '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"add_calendar_event","arguments":{"date":"2030-02-30","title":"invalid"}}}' \
            | build/appimage/cool-retro-term --mcp)
          echo "$out"
          echo "$out" | grep -q '"Note updated."'
          echo "$out" | grep -q 'CI check'
          echo "$out" | grep -q '"isError":true'
          grep -q "Hello from CI" "$XDG_DATA_HOME/cool-retro-term/cool-retro-term/office-desk.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cool-retro-term-qt-appimage
          path: ./*.AppImage

  macos:
    name: Build (macOS, DMG)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
        with:
          version: 6.10.*
          modules: qt5compat qtshadertools qtquick3d
          setup-python: true
          python-version: '3.11'
          cache: true

      - name: Build
        run: ./scripts/build-dmg.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cool-retro-term-qt-dmg
          path: ./*.dmg
